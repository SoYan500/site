title: Your Blog Title
description: Your blog description

# Author defaults
author:
  name: "Default Author"
  bio: "Default author bio"
  email: "default@example.com"
  twitter: "@defaultauthor"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/